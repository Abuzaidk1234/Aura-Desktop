<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>3D Avatar WebGL</title>
        <style>
            body,
            html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background-color: transparent;
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
                cursor: grab;
            }
            canvas:active {
                cursor: grabbing;
            }

            /* --- The floating status pill --- */
            #state-overlay {
                position: absolute;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                font-weight: bold;
                font-size: 14px;
                letter-spacing: 1px;
                color: white;
                background: rgba(0, 0, 0, 0.6);
                padding: 8px 24px;
                border-radius: 25px;
                border: 2px solid #555;
                transition: all 0.3s ease;
                pointer-events: none;
                z-index: 10;
                text-align: center;
            }
            .idle {
                border-color: #555;
                opacity: 0.5;
            }
            .listening {
                border-color: #00ffcc;
                box-shadow: 0 0 20px #00ffcc;
                opacity: 1;
            }
            .thinking {
                border-color: #b000ff;
                box-shadow: 0 0 20px #b000ff;
                opacity: 1;
            }
            .processing {
                border-color: #ffaa00;
                box-shadow: 0 0 20px #ffaa00;
                opacity: 1;
            }

            /* --- NEW: The Frosted Chat Bubble --- */
            #chat-bubble {
                position: absolute;
                bottom: 220px; /* Sits right above his head */
                left: 50%;
                transform: translateX(-50%) translateY(10px);
                max-width: 250px;
                padding: 12px 18px;
                background: rgba(
                    25,
                    25,
                    30,
                    0.45
                ); /* Semi-transparent dark base */
                backdrop-filter: blur(12px); /* Frosted glass effect */
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 16px;
                color: #ffffff;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                font-size: 13px;
                line-height: 1.4;
                text-align: center;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                opacity: 0;
                pointer-events: none;
                transition:
                    opacity 0.4s ease,
                    transform 0.4s ease,
                    box-shadow 0.4s ease;
                z-index: 5;
            }

            /* When active, it floats up slightly and gains a slight glow */
            #chat-bubble.visible {
                opacity: 1;
                transform: translateX(-50%) translateY(0px);
                box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
                border-color: rgba(0, 255, 204, 0.4);
            }
        </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    </head>
    <body>
        <div id="state-overlay" class="idle">IDLE 🧘</div>

        <div id="chat-bubble"></div>

        <script>
            function setClippyState(state) {
                const overlay = document.getElementById("state-overlay");
                overlay.classList.remove(
                    "listening",
                    "thinking",
                    "processing",
                    "idle",
                );
                overlay.classList.add(state);

                let emoji = "🧘";
                if (state === "listening") emoji = "👀";
                if (state === "thinking") emoji = "🤔";
                if (state === "processing") emoji = "⚙️";

                overlay.innerText = state.toUpperCase() + " " + emoji;
            }

            // --- NEW: Chat Bubble Controller ---
            let subtitleTimeout;
            function showSubtitle(text) {
                const bubble = document.getElementById("chat-bubble");
                bubble.innerText = text;
                bubble.classList.add("visible");

                // Reset the timer if a new message comes in
                clearTimeout(subtitleTimeout);
                subtitleTimeout = setTimeout(() => {
                    bubble.classList.remove("visible");
                }, 4000); // Fades out after 4 seconds
            }

            // --- 3D Setup ---
            let scene, camera, renderer, controls;
            let avatarModel;
            const clock = new THREE.Clock();

            init();
            animate();

            function init() {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(
                    45,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    100,
                );
                camera.position.set(0, 0.5, 2.5);

                renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    alpha: true,
                });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setClearColor(0x000000, 0);
                renderer.outputEncoding = THREE.sRGBEncoding;
                document.body.appendChild(renderer.domElement);

                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.target.set(0, 0.5, 0);
                controls.enablePan = false;
                controls.update();

                const hemiLight = new THREE.HemisphereLight(
                    0xffffff,
                    0x444444,
                    1.0,
                );
                hemiLight.position.set(0, 20, 0);
                scene.add(hemiLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight.position.set(3, 10, 10);
                scene.add(dirLight);

                const loader = new THREE.GLTFLoader();
                loader.load("avatar.glb", function (gltf) {
                    avatarModel = gltf.scene;
                    avatarModel.rotation.y = -1.5;
                    scene.add(avatarModel);
                });

                window.addEventListener("resize", onWindowResize, false);
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                if (avatarModel) {
                    const time = clock.getElapsedTime();
                    avatarModel.position.y = Math.sin(time * 2) * 0.01;
                }
                renderer.render(scene, camera);
            }
        </script>
    </body>
</html>
